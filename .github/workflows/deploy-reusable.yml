name: Reusable Deploy

on:
  workflow_call:
  
    inputs:
      environment:
        required: true
        type: string
      version:
        required: false
        type: string
        default: latest
        
    outputs:
      deployed_version:
        value: ${{ jobs.deploy.outputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Set Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
  
      # - name: Install dependencies
        # run: npm ci
  
      # - name: Compile
        # run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # <-- the gate triggers here
    
    outputs:
      version: ${{ inputs.version }}
      
    steps:     
      - name: Run Deployment Script
        run: echo "Deployment Finished......"
