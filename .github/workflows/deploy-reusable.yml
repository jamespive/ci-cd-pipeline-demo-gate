name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      version:
        required: false
        type: string
        default: latest
    secrets:
      DEPLOY_TOKEN:
        required: true
    outputs:
      deployed_version:
        value: ${{ jobs.deploy.outputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # <-- the gate triggers here
    outputs:
      version: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
      - run: ./deploy.sh
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
