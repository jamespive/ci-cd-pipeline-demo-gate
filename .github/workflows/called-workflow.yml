name: Reusable workflow

on:
  workflow_call:
    outputs:
      firstword:
        description: "The first output"
        value: ${{ jobs.generate.outputs.output1 }}
      secondword:
        description: "The second output"
        value: ${{ jobs.generate.outputs.output2 }}

jobs:

  generate:
    name: Generate output
    runs-on: ubuntu-latest

    outputs:
      output1: ${{ steps.output1.outputs.firstword }}
      output2: ${{ steps.output2.outputs.secondword }}

    steps:
      - id: output1
        run: echo "firstword=hello" >> $GITHUB_OUTPUT
        
      - id: output2
        run: echo "secondword=world" >> $GITHUB_OUTPUT
