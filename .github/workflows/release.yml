name: Release

on:
  # push:
    # branches: [main]
    workflow_dispatch: # Runs mannualy too

jobs:
  deploy-staging:
    uses: jamespive/ci-cd-pipeline-demo-gate/.github/workflows/deploy-reusable.yml@main
    with:
      environment: staging
    secrets: inherit

  deploy-prod:
    needs: deploy-staging
    uses: jamespive/ci-cd-pipeline-demo-gate/.github/workflows/deploy-reusable.yml@main
    with:
      environment: production        # requires approval
    secrets: inherit
